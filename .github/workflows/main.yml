name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Simple WebView APK Project
        run: |
          # www හදනවා
          mkdir -p www
          cp -r *.html *.css *.js *.json *.png *.svg www/ 2>/dev/null || true
          ls -la www/

          # Android project එක හදනවා
          mkdir -p android/app/src/main/java/com/myapp/app
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/public

          # settings.gradle
          cat > android/settings.gradle << 'EOF'
          include ':app'
          EOF

          # build.gradle (project)
          cat > android/build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # build.gradle (app)
          cat > android/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.myapp.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.myapp.app"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # AndroidManifest.xml
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="MyApp">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java - Website එක load කරනවා
          cat > android/app/src/main/java/com/myapp/app/MainActivity.java << 'EOF'
          package com.myapp.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/public/index.html");
                  setContentView(webView);
              }
          }
          EOF

          ls -R android/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || true
          # gradle wrapper නැත්තම් හදනවා
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2.1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
