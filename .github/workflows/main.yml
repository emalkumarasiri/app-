name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build PWA to APK
        run: |
          # 1. Capacitor install කරනවා website එක APK කරන්න
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          # 2. Capacitor init
          npx cap init "MyApp" "com.myapp.app" --web-dir="."
          
          # 3. Android project එක හදනවා
          npx cap add android
          
          # 4. Web files ටික copy කරනවා
          npx cap copy

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
