name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create WebView Project
        run: |
          mkdir -p www
          cp *.html *.css *.js *.json www/ 2>/dev/null || true
          cp *.png *.svg www/ 2>/dev/null || true

          mkdir -p android/app/src/main/java/com/myapp/app
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/
          
          echo "include ':app'" > android/settings.gradle
          
          cat > android/build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > android/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.myapp.app'
            compileSdk 34
            defaultConfig { applicationId "com.myapp.app"; minSdk 23; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="MyApp">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/myapp/app/MainActivity.java << 'EOF'
          package com.myapp.app;
          import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              w.loadUrl("file:///android_asset/public/index.html");
              setContentView(w);
            }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
