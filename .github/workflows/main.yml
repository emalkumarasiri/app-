name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build PWA to APK
        run: |
          # www folder එක හදලා files ටික දානවා
          mkdir -p www
          cp -r *.html *.css *.js *.json *.png *.svg www/ 2>/dev/null || true
          cp -r *.png www/ 2>/dev/null || true
          ls -la www/

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          # webDir = www විදියට හදනවා
          npx cap init "MyApp" "com.myapp.app" --web-dir="www"
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
