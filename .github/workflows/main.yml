name: Build APK with Capacitor

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          # Root එකේ ඇති web files www ෆෝල්ඩරයට copy කිරීම
          cp -r *.html *.css *.js *.json *.png *.jpg *.svg www/ 2>/dev/null || true

      - name: Initialize Capacitor and Build Android
        run: |
          # Capacitor install කර ගැනීම
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Capacitor config file එකක් සාදා ගැනීම
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.emalkumarasiri.app",
            "appName": "MyApp",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # Android Project එක එකතු කිරීම සහ Sync කිරීම
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
