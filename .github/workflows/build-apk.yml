name: Build GeethikaLK APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android WebView Project
        shell: bash
        run: |
          set -e

          # www ෆෝල්ඩරය සාදා සියලුම Web Files copy කරගැනීම
          mkdir -p www
          cp -r *.html *.css *.js *.json *.png *.svg www/ 2>/dev/null || true

          # WebView Crash වෙන එක වැලැක්වීමට app.js හි Service Worker කොටස disable කිරීම
          sed -i 's/navigator.serviceWorker.register/console.log/g' www/app.js || true

          # Android Project Directories නිර්මාණය
          mkdir -p android/app/src/main/java/com/emalkumarasiri/geethikalk
          mkdir -p android/app/src/main/assets/public

          # Assets වලට Web files copy කිරීම
          cp -r www/. android/app/src/main/assets/public/

          # gradle.properties නිර්මාණය
          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # settings.gradle නිර්මාණය
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'GeethikaLK'
          include ':app'
          EOF

          # build.gradle (Root) නිර්මාණය
          cat > android/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          # build.gradle (App) නිර්මාණය
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.emalkumarasiri.geethikalk'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.emalkumarasiri.geethikalk'
                  minSdk 23
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          # AndroidManifest.xml නිර්මාණය
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="GeethikaLK"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java නිර්මාණය
          cat > android/app/src/main/java/com/emalkumarasiri/geethikalk/MainActivity.java << 'EOF'
          package com.emalkumarasiri.geethikalk;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/public/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeethikaLK-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
