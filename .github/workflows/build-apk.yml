name: Build GeethikaLK Offline APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Offline Web Assets
        run: |
          mkdir -p www
          # Web Files සියල්ල www ෆෝල්ඩරයට Copy කිරීම
          cp -r *.html *.css *.js *.json *.png *.svg www/ 2>/dev/null || true

          # Service Worker/PWA Register වීම නවතා Offline Local Files පමණක් Load වන ලෙස සැකසීම
          sed -i 's/navigator.serviceWorker.register/console.log/g' www/app.js || true

      - name: Initialize Capacitor Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Capacitor Configuration
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.emalkumarasiri.geethikalk",
            "appName": "GeethikaLK",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android
          npx cap sync android

          # Java 21 Compatibility Fix
          sed -i 's/JAVA_17/JAVA_21/g' android/app/build.gradle || true
          sed -i 's/VERSION_17/VERSION_21/g' android/app/build.gradle || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeethikaLK-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
