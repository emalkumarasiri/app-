<section class="song-view" id="song-view" aria-labelledby="song-title" hidden>
      <button class="back-button" id="back-button" type="button"><span aria-hidden="true">←</span> Back to Songs</button>
      <div class="song-heading"><div><div class="song-meta-line"><span class="song-number" id="view-number"></span><span class="meta-separator">/</span><span class="song-category" id="view-category"></span></div><h1 id="song-title"></h1><p class="original-key" id="original-key"></p></div><span class="song-cross" aria-hidden="true">✝️</span></div>
      
      <div class="song-toolbar" role="toolbar" aria-label="Song Controls">
        <div class="tool-group transpose-group"><span class="tool-caption">Key</span><button class="tool-button" id="transpose-down" type="button" aria-label="Decrease key">−</button><span class="current-key" id="current-key">Key: G</span><button class="tool-button" id="transpose-up" type="button" aria-label="Increase key">+</button></div>
        <div class="tool-group font-group"><span class="tool-caption">Font</span><button class="tool-button" id="font-down" type="button" aria-label="Decrease font size">A−</button><button class="tool-button" id="font-up" type="button" aria-label="Increase font size">A+</button></div>
        <button class="tool-button scroll-button" id="autoscroll-button" type="button" aria-pressed="false"><span aria-hidden="true">▶️</span><span>AutoScroll</span></button>
        <button class="tool-button favourite-button" id="favourite-button" type="button" aria-pressed="false" aria-label="Mark as favorite"><span aria-hidden="true">☆</span><span class="favourite-label">Favorite</span></button>
      </div>

      <div class="sample-notice" id="sample-notice" hidden><span aria-hidden="true">ⓘ</span> This is a sample showing chord format. Update with your licensed lyrics from Admin.</div>
      
      <article class="lyrics-card"><div class="lyrics-topline"><span>Lyrics & Chords</span><span class="lyrics-hint">Chords in orange</span></div><div class="lyrics-content" id="lyrics-content" aria-live="polite"></div></article>
      
      <div class="song-bottom-note"><span class="note-cross" aria-hidden="true">✝️</span><span>Let's worship through music</span><span class="note-rule"></span></div>
    </section>
  </main>

  <footer class="site-footer"><div class="footer-inner"><span class="footer-mark"><span aria-hidden="true">✝️</span> GeethikaLK</span><span>Sinhala Christian Songs & Chords</span><a href="./admin.html">Manage Songs</a></div></footer>
  <script src="./app.js" defer></script>
</body>
</html>
